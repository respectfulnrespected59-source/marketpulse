# Render Blueprint — one-click deploy of the MarketPulse dashboard.
# Pure Python standard library (no third-party deps); Render injects $PORT and
# we set HOST=0.0.0.0 so the service is reachable publicly.
services:
  - type: web
    name: marketpulse
    runtime: python
    plan: free
    branch: main
    buildCommand: "python -m compileall app.py indicators.py options.py backtest.py dca.py config.py"
    startCommand: "python app.py"
    healthCheckPath: /api/universe
    # Off deliberately. Once people are buying against what this demo shows,
    # a routine push must not change the product underneath them — deploys are
    # a decision, not a side effect of a commit. Tagged releases (v1.0) are the
    # reference; promote them by hand.
    autoDeploy: false
    envVars:
      - key: HOST
        value: 0.0.0.0
      # DELIBERATELY PRO while the product is research-only.
      #
      # Real-money trading is not legally available to us yet, so every edition
      # is paper/research regardless of tier. Holding Pro back during that
      # window buys nothing and costs reach — so the hosted demo serves the full
      # feature set and we trade it for attention and real usage data.
      #
      # config.py still fails closed: a public host with NO MP_TIER set falls
      # back to "free". This line is the explicit override, and flipping it to
      # "free" is the single switch that re-gates the demo on the day this
      # becomes a paid platform.
      - key: MP_TIER
        value: pro
      - key: PYTHON_VERSION
        value: "3.11.9"
