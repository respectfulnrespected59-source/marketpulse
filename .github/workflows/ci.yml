name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The app ships as "pure Python, no installs", so it has to keep working
        # on whatever interpreter a buyer already has.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Tests
        run: python -m pytest -q

  buyer-packs:
    name: buyer packs build and stay separated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Guards the thing that is easy to get wrong by hand: the free zip must
      # not carry Pro modules, and every script index.html loads must be present
      # in both zips.
      - name: Build both editions
        run: python tools/build_buyer_pack.py
